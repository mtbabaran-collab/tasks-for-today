# CI: runs the test suite, then builds the production Docker image and checks the pages respond.
name: Tests and Docker smoke test

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t tasks-for-today .
      - name: Start it like Render does (PORT=10000, proxy sends X-Forwarded-Proto)
        run: |
          docker run -d --name app -p 10000:10000 -e PORT=10000 -e APP_ENV=production -e APP_DEBUG=false \
            -e APP_KEY_SOURCE=$(openssl rand -base64 32) -e LOG_CHANNEL=stderr -e MAIL_MAILER=log tasks-for-today
          for i in $(seq 1 30); do curl -fs http://localhost:10000/up && break; sleep 2; done
          docker logs app | tail -30
      - name: Pages respond and links use https behind the proxy
        run: |
          set -e
          for p in / /tasks /profile /about /login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://localhost:10000$p)
            echo "$p -> $code"; [ "$code" = "200" ]
          done
          curl -s -H 'X-Forwarded-Proto: https' http://localhost:10000/tasks | grep -q 'Finish IT0049 TSA4 write-up'
          curl -s -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: example.onrender.com' http://localhost:10000/login | grep -q 'https://example.onrender.com/build/assets/'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/tasks/create)
          echo "/tasks/create (guest) -> $code"; [ "$code" = "302" ]
      - name: Full flow on the production image (log in, mark done, email sent once)
        run: |
          set -e
          B=http://localhost:10000; J=jar.txt
          token() { curl -s -c $J -b $J "$1" | grep -o 'name="_token" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"//'; }
          T=$(token $B/login)
          curl -s -c $J -b $J -o /dev/null -X POST $B/login --data-urlencode "_token=$T" \
            --data-urlencode "email=demo@tasksfortoday.test" --data-urlencode "password=password"
          code=$(curl -s -b $J -o /dev/null -w '%{http_code}' $B/tasks/create); echo "create page after login -> $code"; [ "$code" = "200" ]
          T=$(token $B/tasks/create)
          loc=$(curl -s -c $J -b $J -o /dev/null -w '%{redirect_url}' -X POST $B/tasks --data-urlencode "_token=$T" \
            --data-urlencode "title=CI email check" --data-urlencode "status=pending" --data-urlencode "priority=high")
          ID=${loc##*/}; echo "created task $ID"
          for i in 1 2; do
            T=$(token $B/tasks/$ID/edit)
            curl -s -c $J -b $J -o /dev/null -X POST $B/tasks/$ID --data-urlencode "_token=$T" --data-urlencode "_method=PUT" \
              --data-urlencode "title=CI email check" --data-urlencode "status=done" --data-urlencode "priority=high"
          done
          sleep 2
          n=$(docker logs app 2>&1 | grep -c "Subject: Task completed: CI email check" || true)
          echo "completion emails in the log: $n"; [ "$n" = "1" ]
