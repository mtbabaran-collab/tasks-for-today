# Render Blueprint: one free web service built from the Dockerfile.
# No secrets here. The app key is generated when the container starts (docker/start.sh).
services:
  - type: web
    name: tasks-for-today
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      # Random 256-bit value made by Render once; docker/start.sh turns it into APP_KEY.
      - key: APP_KEY_SOURCE
        generateValue: true
      - key: APP_URL
        value: https://tasks-for-today-u5ov.onrender.com
      - key: APP_NAME
        value: Tasks for Today
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: LOG_CHANNEL
        value: stderr
      # Emails are written to the log (visible in Render > Logs), so no real inbox is needed.
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: no-reply@tasksfortoday.test
      - key: TASK_NOTIFY_EMAIL
        value: tasks-admin@example.com
